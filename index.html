  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Spot Robotics",
    "url": "https://spotrobotics.app",

    ]

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .logo img {
      height: 1.6em;
      width: 1.6em;
      border-radius: 22%;
    }
    .tagline {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 3rem;
    }
    .apps {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .app-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      text-align: center;
      min-width: 160px;
    }
    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      object-fit: cover;
      margin: 0 auto 0.75rem;
      display: block;
    }
    .app-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    .app-card a {
      font-size: 0.8rem;
      color: #6b9fff;
      text-decoration: none;
    }
    .app-card a:hover { text-decoration: underline; }
    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #444;
    }
    .contact-btn {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 1px solid #2a2a2a;
      color: #6b9fff;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .15s ease, background .15s ease;
    }
    .contact-btn:hover { border-color: #6b9fff; background: rgba(107,159,255,0.08); }
  </style>
</head>
<body>
  <div class="logo"><span>Spot Robotics</span><img src="/icons/logo-header.png" alt="Spot Robotics logo"></div>
  <div class="tagline">Simple apps. Honest policies.</div>

  <div class="apps">
    <div class="app-card">
      <img class="app-icon" src="/icons/directdrop.png" alt="DirectDrop icon">
      <div class="app-name">DirectDrop</div>
      <a href="/directdrop/" style="font-weight:600;">Open app page</a><br>
      <a href="/directdrop/privacy.html">Privacy Policy</a>
    </div>
    <div class="app-card">
      <img class="app-icon" src="/icons/truebubble.jpg" alt="TrueBubble icon">
      <div class="app-name">TrueBubble</div>
      <a href="/truebubble/" style="font-weight:600;">Open app page</a><br>
      <a href="/truebubble/privacy.html">Privacy Policy</a>
    </div>
    <div class="app-card">
      <img class="app-icon" src="/icons/fogrider.png" alt="FogRider icon">
      <div class="app-name">FogRider</div>
      <a href="/fogrider/privacy.html">Privacy Policy</a>
    </div>
    <div class="app-card">
      <img class="app-icon" src="/icons/eggspeed.png" alt="EggSPEED icon">
      <div class="app-name">EggSPEED</div>
      <a href="/eggspeed/" style="font-weight:600;">Open app page</a><br>
      <a href="/eggspeed/privacy.html">Privacy Policy</a>
    </div>
  </div>

  <a class="contact-btn" href="/support/">Support &amp; Feedback</a>

  <footer>&copy; 2026 Spot Robotics - Tomasz Pieczara</footer>
</body>
</html>
